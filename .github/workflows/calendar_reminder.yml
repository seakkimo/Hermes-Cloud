name: Calendar Reminder

on:
  schedule:
    # 00:00 UTC = 08:00 UTC+8
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger calendar reminder on Render
        run: |
          curl -f -X POST ${{ secrets.RENDER_URL }}/task \
            -H "Content-Type: application/json" \
            -H "x-scheduler-secret: ${{ secrets.SCHEDULER_SECRET }}" \
            -d '{"task": "calendar_reminder"}'
