name: Proactive 08:00

on:
  schedule:
    # 00:00 UTC = 08:00 UTC+8
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger proactive tasks (08:00 slot)
        run: |
          curl -f -X POST ${{ secrets.RENDER_URL }}/task \
            -H "Content-Type: application/json" \
            -H "x-scheduler-secret: ${{ secrets.SCHEDULER_SECRET }}" \
            -d '{"task": "proactive", "slot": "08:00"}'
