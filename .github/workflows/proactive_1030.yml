name: Proactive 10:30

on:
  schedule:
    # 02:30 UTC = 10:30 UTC+8
    - cron: "30 2 * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger proactive tasks (10:30 slot)
        run: |
          curl -f -X POST ${{ secrets.RENDER_URL }}/task \
            -H "Content-Type: application/json" \
            -H "x-scheduler-secret: ${{ secrets.SCHEDULER_SECRET }}" \
            -d '{"task": "proactive", "slot": "10:30"}'
